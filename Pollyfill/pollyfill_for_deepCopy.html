      // let arr = [1,2,[3,4]];

      // brr[2].push(5);

      // console.log(arr); // [1,2,[3,4]]

      // Now we create a pollyfill for Deep Copy
      // let arr = [1,2,[3,4]];
      // let brr = arr;
      // brr[2].push(5);
      // console.log(arr); // [1,2,[3,4,5]]
      // console.log(brr); // [1,2,[3,4,5]]

      let obj = {
        a1: {
          b1: {
            c1: "ss",
          },
        },
      };

      // let obj2 = obj;
      // obj2.a1.b1 = null;
      // console.log(obj);
      // console.log(obj2);

      function deepCopy(val) {
        // here val is arr
        if (["string", "number", "boolean"].includes(typeof val)) {
          // if val is any primitive value like 2,1,true,"hii" then we will directly return that primitive val
          return val;
        } else if (Array.isArray(val)) {
          return val.map((el) => deepCopy(el)); // this map method will return a new array
          // return val.map((el) => el)  // we can directly pass the el from here
        } else {
          // let's suppopse we have an object then this condition will work
          return Object.keys(val).reduce((acc, key) => {
            acc[key] = deepCopy(val[key]);
            return acc;
          }, {}); // here acc = {}
        }
      }

      // if arr is array
      // let brr = deepCopy(arr);
      // brr[2].push(5);
      // console.log(arr); // [1,2,[3,4]]
      // console.log(brr); // [1,2,[3,4,5]]

      // if obj is object
      let obj2 = deepCopy(obj);
      obj2.a1.b1 = null;
      console.log(obj); // { a1: {b1: {c1: 'ss'}} }
      console.log(obj2); // { a1: {b1: null} }
    </script>
