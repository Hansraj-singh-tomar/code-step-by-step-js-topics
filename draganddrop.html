<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag And Drop Using HTML</title>
    <style>
        #ball{
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 100%;
        };
        #dropZone{
            width: 200px;
            height: 100px;
            padding: 10px;
            border: 1px solid #563ceb;
        }
    </style>
</head>
<body>
    <div id="dropZone" ondrop="drop(event)" ondragover="allowDrop(event)"> </div>
    <br/>
    <div id="ball" draggable="true" ondragstart="drag(event)"></div>
    <script>
        function allowDrop(ev){
            ev.preventDefault();
        }
        function drag(ev){
            ev.dataTransfer.setData("text", ev.target.id);
        }
        function drop(ev){
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            ev.target.appendChild(document.getElementById(data));
        }
    </script>
</body>
</html>
